<footer class="site-footer">
	<div class="footer-inner">
		<ul class="footer-tagline">
			{{usps}}
		</ul>
		<nav class="foot-categories" aria-label="Categorieën">
			{{categoryLinks}}
		</nav>
		<!-- Wettelijk verplichte bedrijfsgegevens (informatieplicht webwinkels, art. 3:15d BW) -->
		<address class="footer-business">
			<strong>{{name}}</strong> · {{addressLine}}<br>
			KvK {{kvk}} · Btw {{btw}} · <a href="mailto:{{email}}">{{email}}</a>
		</address>
		<nav class="foot-nav" aria-label="Footermenu">
			<a href="{{home}}">Home</a>
			<span class="separator" aria-hidden="true">·</span>
			<a href="{{root}}webshop.html">Webshop</a>
			<span class="separator" aria-hidden="true">·</span>
			<a href="{{instagram}}" target="_blank" rel="noopener noreferrer">Instagram</a>
			<span class="separator" aria-hidden="true">·</span>
			<a href="{{root}}privacy.html">Privacyverklaring</a>
			<span class="separator" aria-hidden="true">·</span>
			<a href="{{root}}voorwaarden.html">Algemene voorwaarden</a>
			<span class="separator" aria-hidden="true">·</span>
			<button type="button" class="foot-link-button" data-cookie-settings>Cookie-instellingen</button>
		</nav>
		<p class="footer-copyright">© {{year}} {{name}} · 3D-design met karakter · Handgemaakt in Limburg</p>
	</div>
</footer>
